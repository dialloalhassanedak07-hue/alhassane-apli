<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matara Digitale Services</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      height: 100vh;
      background: url("background.jpg") no-repeat center center / cover;
      overflow: hidden;
    }

    .overlay {
      height: 100%;
      background: rgba(0, 0, 0, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: white;
      padding: 32px 22px;
      width: 92%;
      max-width: 380px;
      border-radius: 22px;
      text-align: center;
      animation: fadeUp 1s ease forwards;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .photo {
      width: 145px;
      height: 145px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 15px;
      border: 4px solid #111;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 8px;
    }

    .msg {
      font-size: 15px;
      margin-bottom: 22px;
      color: #333;
      font-weight: 600;
    }

    .btn {
      display: block;
      text-decoration: none;
      padding: 13px;
      margin: 10px 0;
      border-radius: 12px;
      color: white;
      font-weight: bold;
    }

    .call { background: #000; }
    .whatsapp { background: #25D366; }
    .facebook { background: #1877F2; }
    .instagram {
      background: linear-gradient(45deg, #f58529, #dd2a7b, #8134af);
    }
    .gmail { background: #EA4335; }
  </style>
</head>

<body>
  <div class="overlay">
    <div class="card">
      

<img src="images/retouche_2026011703020944.jpg" alt="Photo profil" class="photo">

      <h1>Matara Digitale Services</h1>
      <div class="msg">Bienvenue — Accueil professionnel</div>

      <a class="btn call" href="tel:+221775450350">📞 Appeler</a>
      <a class="btn whatsapp" href="https://wa.me/221775450350">💬 WhatsApp Business</a>
      <a class="btn facebook" href="#">📘 Facebook</a>
      <a class="btn instagram" href="#">📸 Instagram</a>
      <a class="btn gmail" href="mailto:example@gmail.com">✉️ Gmail</a>
    </div>
  </div>
</body>
</html>
